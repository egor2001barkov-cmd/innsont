<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="t">
  <title id="t">Топвизор снимает места. INSONT ставит задачу на неделю</title>
  <rect width="1100" height="320" rx="28" fill="#fffcf7"/>
  <text x="36" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#ff6a2b">INSONT</text>
  <text x="36" y="78" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#161513">Съём позиций → строка в очереди</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15">
    <rect x="28" y="108" width="1044" height="52" rx="12" fill="#f6f1e8"/>
    <text x="48" y="140" fill="#161513">узи москва цена · 11 место · нет цены на /uzi</text>
    <rect x="28" y="172" width="1044" height="52" rx="12" fill="#fff1e8"/>
    <text x="48" y="204" fill="#161513">Задача на вторник: вилка цен и врач. Не «ещё ключей в Топвизор».</text>
    <text x="36" y="268" font-size="14" fill="#6b6560">Съём можно оставить. Работы — здесь, публикация после «ок».</text>
  </g>
</svg>
