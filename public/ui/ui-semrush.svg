<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="t">
  <title id="t">Кабинет INSONT: запрос сразу в Яндексе, Google и GigaChat — то, чего нет в одном Semrush</title>
  <rect width="1100" height="380" rx="28" fill="#fffcf7"/>
  <text x="36" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#ff6a2b">INSONT</text>
  <text x="36" y="82" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#161513">Одна строка: Яндекс, Google и модель</text>
  <text x="36" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6560">Semrush хорошо видит Google. Здесь рядом лежит то, чего в нём нет.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14">
    <rect x="28" y="136" width="1044" height="56" rx="14" fill="#f6f1e8"/>
    <text x="48" y="158" fill="#6b6560">запрос</text>
    <text x="48" y="178" font-size="16" fill="#161513">вклад в рублях на год</text>
    <text x="480" y="158" fill="#6b6560">Яндекс</text>
    <text x="480" y="178" font-size="16" fill="#161513">3</text>
    <text x="620" y="158" fill="#6b6560">Google</text>
    <text x="620" y="178" font-size="16" fill="#161513">8</text>
    <text x="760" y="158" fill="#6b6560">GigaChat</text>
    <text x="760" y="178" font-size="16" fill="#1f8a4c">называют</text>
    <text x="940" y="158" fill="#6b6560">Wordstat</text>
    <text x="940" y="178" font-size="16" fill="#161513">12 400</text>
    <rect x="28" y="204" width="1044" height="56" rx="14" fill="#f6f1e8"/>
    <text x="48" y="226" fill="#6b6560">запрос</text>
    <text x="48" y="246" font-size="16" fill="#161513">какой вклад открыть если боюсь курса</text>
    <text x="480" y="246" font-size="16" fill="#161513">—</text>
    <text x="620" y="246" font-size="16" fill="#161513">—</text>
    <text x="760" y="246" font-size="16" fill="#1f8a4c">часто</text>
    <text x="940" y="246" font-size="16" fill="#6b6560">нет в Wordstat</text>
    <rect x="28" y="272" width="1044" height="80" rx="14" fill="#fff1e8"/>
    <text x="48" y="306" font-size="15" fill="#161513">Очередь не «докупить ключи в Semrush».</text>
    <text x="48" y="330" font-size="15" fill="#161513">На сайте нет таблицы ставок — поэтому модель советует чужой банк, хотя в Яндексе вы третьи.</text>
  </g>
</svg>
