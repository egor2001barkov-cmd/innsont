  <rect width="1100" height="340" rx="28" fill="#fffcf7"/>
  <text x="36" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#ff6a2b">INSONT</text>
  <text x="36" y="78" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#161513">Позиция есть. Цены на карточке нет. Модель молчит.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15">
    <rect x="28" y="108" width="1044" height="56" rx="14" fill="#f6f1e8"/>
