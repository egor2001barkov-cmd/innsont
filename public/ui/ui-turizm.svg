<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="t">
  <title id="t">Кабинет INSONT: туры и даты, сезонность в Яндексе и Google</title>
  <rect width="1100" height="380" rx="28" fill="#fffcf7"/>
  <text x="36" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#ff6a2b">INSONT</text>
  <text x="36" y="82" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#161513">Туры · даты выезда, не «лучший отдых»</text>
  <text x="36" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6560">Сезон к маю закладывают зимой. В выдаче побеждает страница с датой, не буклет.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="28" y="140" width="1044" height="52" rx="16" fill="#f6f1e8"/>
    <text x="48" y="172" font-size="15" fill="#161513">Сочи, майские, перелёт и отель 4 ночи</text>
    <text x="720" y="172" font-size="14" fill="#6b6560">спрос растёт с февраля</text>
    <text x="980" y="172" font-size="14" fill="#c43c2c">страницы нет</text>
    <rect x="28" y="202" width="1044" height="52" rx="16" fill="#f6f1e8"/>
    <text x="48" y="234" font-size="15" fill="#161513">Петергоф, экскурсия на один день</text>
    <text x="720" y="234" font-size="14" fill="#6b6560">Яндекс 6 · Google 8</text>
    <text x="980" y="234" font-size="14" fill="#1f8a4c">дата есть</text>
    <rect x="28" y="264" width="1044" height="52" rx="16" fill="#f6f1e8"/>
    <text x="48" y="296" font-size="15" fill="#161513">Калининград, 7 дней, виза не нужна</text>
    <text x="720" y="296" font-size="14" fill="#6b6560">Яндекс 14 · Google 9</text>
    <text x="980" y="296" font-size="14" fill="#c47a12">цена «от»</text>
    <rect x="28" y="326" width="1044" height="40" rx="16" fill="#fff1e8"/>
    <text x="48" y="352" font-size="14" fill="#b4531e">Очередь: закрыть майские до конца января, не в апреле</text>
  </g>
</svg>
