services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://insont.ru}
      - YANDEX_WORDSTAT_TOKEN=${YANDEX_WORDSTAT_TOKEN:-}
      - YANDEXGPT_API_KEY=${YANDEXGPT_API_KEY:-}
      - YANDEXGPT_FOLDER_ID=${YANDEXGPT_FOLDER_ID:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-4.1-flash}
    volumes:
      - ./data:/app/data
